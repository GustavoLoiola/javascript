<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightgray;
        }

        p {
            font-size: 2em;
        }
    </style>
</head>
<body>
    <h1>Sistema de Multas</h1>
    <div>Velocidade do carro<input type="number" name="vel" id="txtvel">Km/h
    <input type="button" value="Verificar" onclick="calcular()"></div>
    <div id="resultado">

    </div>


    <script>
        function calcular() {
        var txtv = window.document.getElementById('txtvel')
        var vel = Number(txtv.value)
        var resultado = window.document.querySelector('div#resultado')
        resultado.innerHTML = `<p>Sua velocidade é de ${vel}Km/h</p>`
        if (vel > 80) {
            resultado.innerHTML += `<p>Você foi MULTADO!</p>`
        }
    }
    </script>
</body>
</html>
