<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de contagem com passos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos Contar!</h1>
        <p>(Um clássico da programação)</p>
    </header>
    <main>
        <div>
            <p>Início: <input type="number" name="" id="primeiro-num" required class="num"></p>
            <p>Fim: <input type="number" name="" id="ultimo-num" required class="num"></p>
            <p>Passo: <input type="number" name="" id="passo" required class="num"></p>
            <input type="button" value="Visualizar" id="botao" onclick="contador()">
        </div>
        <div>
            <p id="resposta">Preparando a contagem...</p>
        </div>
    </main>



    <script src="index.js"></script>
</body>
</html>
