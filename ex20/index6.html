<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="estilo6.css">
    <script src="index6.js"></script>
</head>
<body>
    <div id="calculadora">
        <div id="resultado">
            <p id="res"></p>
        </div>
        <div id="numeros">
            <p id="p7">7</p>
            <p id="p8">8</p>
            <p id="p9">9</p>
            <p id="p4">4</p>
            <p id="p5">5</p>
            <p id="p6">6</p>
            <p id="p1" onclick="teste()">1</p>
            <p id="p2">2</p>
            <p id="p3">3</p>
            <p id="p0">0</p>
            <p id="p00">00</p>
            <p>.</p>
        </div>
        <div id="operadores">
            <p>=</p>
            <p>+</p>
            <p>-</p>
            <p>x</p>
            <p>÷</p>
            <p>%</p>
        </div>
    </div>
</body>
</html>
