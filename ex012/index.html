<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Verificador de Idade</h1>
    <main>
        <form action="">
            <div>Ano de nascimento: <input type="number" name="data" placeholder="(xxxx)" id="nascimento" required></div>
             <p id="campo-sexo">Sexo:
                <label for="option">
                <input type="radio" name="sex" id="mas">Masculino</label>
                <label for="option">
                <input type="radio" name="sex" id="fem">feminino</label>
             </p>
                
            <br>
            <input type="button" value="Verificar" id="botao" onclick="idade()">
            <p id="res">Preencha o formulário acima para visualizar o resultado!</p>
        </form>
    </main>

    <script src="index.js"></script>
</body>
</html>
